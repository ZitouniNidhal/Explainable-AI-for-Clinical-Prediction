# ============================================
# Configuration globale du projet (Version SOTA)
# ============================================
project:
  name: "XAI Pan-Cancer SOTA Prediction"
  version: "2.0.0"
  random_state: 42

# ============================================
# Chemins du projet
# ============================================
paths:
  data: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "models"
  results: "results"
  figures: "figures"
  logs: "logs"
  reports: "reports"


# ============================================
# Configuration des données
# ============================================
data:
  dataset_name: "brca_tcga"
  data_dir: "data/raw/brca_tcga"
  pancan_dir: "data/raw/pancan"
  clinical_file: "data_clinical_patient.txt"
  genomic_files:
    - "data_cna.txt"
    - "data_mrna_seq_v2_rsem.txt"
    - "data_mutations.txt"
  target_column: "OS"
  filter_cancer_type: null
  use_synthetic: false
  test_size: 0.15
  validation_size: 0.15
  missing_threshold: 0.2  # Plus strict
  imputation_strategy: "simple"  # Plus stable pour les données à haute dimension (évite les erreurs mémoire)
  n_genes: 5000  # On garde plus de gènes pour capturer des signaux subtils
  gene_selection_method: "variance"

# ============================================
# Prétraitement Avancé
# ============================================
preprocessing:
  scaling: "robust"  # Gère les outliers cliniques
  genomic_scaling: "log2"
  balance_classes: true
  balance_method: "smote"
  feature_selection: "f_classif"
  max_features: 100  # Réduit pour éviter l'overfitting et améliorer la généralisation

# ============================================
# Benchmark de 11 Modèles (Hyper-Optimisé)
# ============================================
models:
  classifiers:
    - name: "logistic_regression"
      enabled: true
      params:
        C: [0.01, 0.1, 1.0, 10.0]
        penalty: ["l2"]
        solver: ["saga"]

    - name: "random_forest"
      enabled: true
      params:
        n_estimators: [200, 500]
        max_depth: [10, 20, null]
        class_weight: ["balanced"]

    - name: "xgboost"
      enabled: true
      params:
        n_estimators: [500, 1000]
        max_depth: [6, 10]
        learning_rate: [0.01, 0.05]
        tree_method: ["hist"]

    - name: "lightgbm"
      enabled: true
      params:
        n_estimators: [500, 1000]
        num_leaves: [31, 127]
        learning_rate: [0.01, 0.05]
        class_weight: ["balanced"]

    - name: "extra_trees"
      enabled: true
      params:
        n_estimators: [500]
        max_depth: [20, null]
        class_weight: ["balanced"]

    - name: "catboost"
      enabled: true
      params:
        iterations: [500, 1000]
        depth: [6, 10]
        auto_class_weights: ["Balanced"]

    - name: "ada_boost"
      enabled: true
      params:
        n_estimators: [200]
        learning_rate: [0.1, 1.0]

    - name: "gradient_boosting"
      enabled: true
      params:
        n_estimators: [300]
        learning_rate: [0.1]
        max_depth: [5]

    - name: "svm"
      enabled: true
      params:
        C: [1.0, 10.0]
        kernel: ["rbf"]
        probability: [true]

    - name: "knn"
      enabled: true
      params:
        n_neighbors: [5, 10, 20]
        weights: ["distance"]

    - name: "mlp"
      enabled: true
      params:
        hidden_layer_sizes: [[200, 100, 50], [100, 100]]
        alpha: [0.0001, 0.001]
        max_iter: [1000]

    - name: "naive_bayes"
      enabled: true

    - name: "decision_tree"
      enabled: true

    - name: "sgd"
      enabled: true

    - name: "ridge"
      enabled: true

    - name: "qda"
      enabled: true

    - name: "bagging"
      enabled: true

    - name: "hist_gradient_boosting"
      enabled: true

  hyperparameter_tuning:
    method: "bayesian"
    n_trials: 100  # Optimisation massive pour des résultats SOTA
    cv_folds: 5
    scoring: "roc_auc"

# ============================================
# Explicabilité SOTA
# ============================================
explainability:
  global_methods: ["feature_importance", "permutation_importance"]
  local_methods: ["shap", "lime"]
  shap:
    explainer_type: "auto"
    nsamples: 500
    max_display: 30

# ============================================
# Robustesse Extrême
# ============================================
robustness:
  noise_tests:
    - type: "gaussian"
      levels: [0.01, 0.05, 0.1, 0.15]
    - type: "missing"
      levels: [0.05, 0.1, 0.2, 0.3]